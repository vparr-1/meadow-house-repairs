<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meadow House | Repairs</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#10213b;color:white;padding:22px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:27px}header p{margin:6px 0 0;color:#d8e2f1}main{max-width:1120px;margin:auto;padding:26px 18px 60px}.layout{display:grid;grid-template-columns:360px 1fr;gap:22px}.panel{background:white;border:1px solid #dbe2eb;border-radius:16px;padding:22px;box-shadow:0 4px 20px #14243c0a}h2{margin:0 0 18px;font-size:21px}h3{margin:0 0 10px}label{display:block;font-weight:650;margin:16px 0 7px}input,textarea,select{font:inherit;width:100%;border:1px solid #8b98aa;border-radius:9px;padding:11px;background:white;color:#17243b}textarea{resize:vertical;min-height:95px}button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}button.primary{background:#1458b4;color:white}button.secondary{background:#eaf1fb;color:#123f78}button:hover{filter:brightness(.94)}:focus-visible{outline:3px solid #f19c25;outline-offset:3px}.full{width:100%;margin-top:18px}.muted{color:#52637b}.small{font-size:13px}.notice{padding:12px;border-radius:9px;margin:12px 0;white-space:pre-wrap}.error{background:#fff0ed;color:#8b2517;border:1px solid #e9a99f}.success{background:#eaf7ef;color:#185b32;border:1px solid #a7d4b5}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.count{font-weight:700;color:#52637b}.jobs{display:grid;gap:10px;margin-top:15px}.job{display:block;text-align:left;width:100%;background:#fff;border:1px solid #d1dae6;padding:15px;border-radius:11px;color:inherit}.job[aria-current=true]{border:2px solid #1458b4;background:#f0f6ff}.jobtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:13px;font-weight:750;background:#e8edf4;padding:5px 9px;border-radius:20px;white-space:nowrap}.pill.urgent{background:#fff0d7;color:#784000}.pill.completed{background:#dff3e6;color:#185b32}.jobdesc,.history-note,.latest{white-space:pre-wrap;overflow-wrap:anywhere}.jobdesc{margin:9px 0}.details{margin-top:22px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.meta span{background:#eef2f7;border-radius:8px;padding:7px 10px;font-size:14px}.history{list-style:none;padding:0;margin:12px 0}.history li{border-left:3px solid #b7cbe6;padding:4px 0 16px 16px;margin-left:6px}.history time{display:block;color:#52637b;font-size:13px;margin:4px 0}.history-note{margin:7px 0 0}.latest{background:#f1f5fa;border-radius:10px;padding:13px}.empty{padding:25px;text-align:center;color:#52637b;border:1px dashed #aebbd0;border-radius:12px}.hide{display:none!important}@media(max-width:780px){.layout{grid-template-columns:1fr}header{padding:20px}main{padding:18px 12px}.panel{padding:18px}}@media(min-width:781px){.right{min-width:0}}
</style>
</head>
<body>
<header><h1>Meadow House Repairs</h1><p>Report faults · Track progress · Keep a complete record</p></header>
<main><div id="globalMessage" role="status" aria-live="polite"></div><div class="layout"><section class="panel" aria-labelledby="reportTitle"><h2 id="reportTitle">Report a fault</h2><p class="muted">Property: <strong>Meadow House</strong></p><form id="reportForm" novalidate><label for="description">Fault description</label><textarea id="description" placeholder="e.g. Garden fence damaged" aria-describedby="reportError"></textarea><label for="reporter">Reporter name</label><input id="reporter" type="text" placeholder="e.g. Alex Morgan" aria-describedby="reportError"><label for="priority">Priority</label><select id="priority"><option>Normal</option><option>Urgent</option></select><div id="reportError" role="alert"></div><button class="primary full" type="submit">Submit fault report</button></form></section><section class="right"><section class="panel" aria-labelledby="jobsTitle"><div class="topline"><h2 id="jobsTitle">Repair jobs</h2><span class="count" id="jobCount">0 jobs</span></div><p class="muted small">Select a job to see its details and record an update.</p><div class="jobs" id="jobList"></div></section><section id="details" class="panel details hide" aria-labelledby="detailsTitle"><h2 id="detailsTitle" tabindex="-1">Job details</h2><div id="jobInfo"></div><h3>Latest note</h3><div class="latest" id="latestNote"></div><form id="updateForm" novalidate><h3 style="margin-top:24px">Update repair</h3><label for="status">Status</label><select id="status"><option>New</option><option>In Progress</option><option>Completed</option></select><label for="updateNote">Progress / completion note</label><textarea id="updateNote" placeholder="Describe what has happened" aria-describedby="updateError"></textarea><div id="updateError" role="alert"></div><button class="primary full" type="submit">Save repair update</button></form><h3 style="margin-top:26px">Status history</h3><ol id="history" class="history"></ol></section></section></div></main>
<script>
(()=>{'use strict';const KEY='meadow-house-repairs-v1';const $=id=>document.getElementById(id);let jobs=[];let selected=null;try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))jobs=saved.filter(j=>j&&typeof j.id==='string'&&Array.isArray(j.history));}catch(e){$('globalMessage').className='notice error';$('globalMessage').textContent='Saved jobs could not be read. New reports may replace damaged saved data.';}
const dateTime=iso=>new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'});const stamp=()=>new Date().toISOString();const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(jobs));return true}catch(e){show('Unable to save in this browser. Check storage settings or available space.',true);return false}};const show=(msg,error=false)=>{const n=$('globalMessage');n.className='notice '+(error?'error':'success');n.textContent=msg;n.setAttribute('role',error?'alert':'status');};const err=(id,msg)=>{const n=$(id);n.className=msg?'notice error':'';n.textContent=msg;};
function render(){const list=$('jobList');list.replaceChildren();$('jobCount').textContent=`${jobs.length} job${jobs.length===1?'':'s'}`;if(!jobs.length)list.append(el('div','empty','No repair jobs yet. Submit a fault report to get started.'));jobs.slice().reverse().forEach(j=>{const b=el('button','job');b.type='button';b.setAttribute('aria-current',String(j.id===selected));const top=el('div','jobtop');top.append(el('strong','',j.id));top.append(el('span','pill '+(j.status==='Completed'?'completed':''),j.status));b.append(top,el('div','jobdesc',j.description));const foot=el('div','topline');foot.append(el('span','small muted',j.reporter+' · '+dateTime(j.createdAt)),el('span','pill '+(j.priority==='Urgent'?'urgent':''),j.priority));b.append(foot);b.addEventListener('click',()=>{selected=j.id;err('updateError','');$('updateNote').value='';render();$('detailsTitle').focus();});list.append(b)});renderDetails();}
function renderDetails(){const j=jobs.find(x=>x.id===selected);$('details').classList.toggle('hide',!j);if(!j)return;const info=$('jobInfo');info.replaceChildren();info.append(el('p','jobdesc',j.description));const meta=el('div','meta');['ID: '+j.id,'Property: Meadow House','Reporter: '+j.reporter,'Priority: '+j.priority,'Status: '+j.status,'Reported: '+dateTime(j.createdAt)].forEach(x=>meta.append(el('span','',x)));info.append(meta);$('latestNote').textContent=j.latestNote||'No progress note yet.';$('status').value=j.status;const hist=$('history');hist.replaceChildren();j.history.slice().reverse().forEach(h=>{const li=el('li');li.append(el('strong','',h.status));const t=el('time','',dateTime(h.at));t.dateTime=h.at;li.append(t);if(h.note)li.append(el('p','history-note',h.note));hist.append(li)});}
$('reportForm').addEventListener('submit',e=>{e.preventDefault();err('reportError','');const description=$('description').value.trim(),reporter=$('reporter').value.trim(),priority=$('priority').value;if(!description||!reporter){err('reportError',!description&&!reporter?'Enter a fault description and reporter name.':!description?'Enter a fault description.':'Enter a reporter name.');(!description?$('description'):$('reporter')).focus();return;}const at=stamp();const id='MH-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();const j={id,createdAt:at,description,reporter,priority,status:'New',latestNote:'',history:[{status:'New',note:'Fault reported',at}]};jobs.push(j);if(!save()){jobs.pop();return;}selected=id;$('reportForm').reset();render();show('Fault report saved successfully: '+id+'. Status: New.');$('detailsTitle').focus();});
$('updateForm').addEventListener('submit',e=>{e.preventDefault();err('updateError','');const j=jobs.find(x=>x.id===selected);if(!j)return;const status=$('status').value,note=$('updateNote').value.trim();if(status==='Completed'&&!note){err('updateError','A completion note is required before saving Completed. No changes have been saved.');$('updateNote').focus();return;}if(!note&&status===j.status){err('updateError','Enter a progress note or choose a different status.');$('updateNote').focus();return;}const old={status:j.status,latestNote:j.latestNote,history:j.history.slice()};j.status=status;if(note)j.latestNote=note;j.history.push({status,note,at:stamp()});if(!save()){Object.assign(j,old);return;}$('updateNote').value='';render();show('Repair update saved for '+j.id+'. Status: '+status+(note?'. Latest note: '+note:''));$('detailsTitle').focus();});render();})();
</script>
</body></html>
